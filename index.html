<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="description" content="SMDB — ابزار استخراج اطلاعات فیلم از IMDb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <title>SMDB — استخراج اطلاعات IMDb</title>
  <style>
/* ─── Variables ─────────────────────────────────────────────────────────── */
:root {
  --gold: #f5c518;
  --gold-dark: #d4a80f;
  --bg: #0f0f0f;
  --bg2: #181818;
  --card: #1c1c1c;
  --card2: #232323;
  --border: #2a2a2a;
  --text: #ffffff;
  --text2: #b0b0b0;
  --text3: #707070;
  --success: #21d07a;
  --error: #e34c4c;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.5);
}

/* ─── Base ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  direction: rtl;
}
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ─── App wrapper ───────────────────────────────────────────────────────── */
#app { max-width: 1100px; margin: 0 auto; padding: 1rem; }

/* ─── Header ────────────────────────────────────────────────────────────── */
.app-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.5rem 0 1rem;
  border-bottom: 2px solid var(--border);
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.logo {
  background: var(--gold);
  color: #000;
  font-weight: 900;
  font-size: 1.6rem;
  padding: .2rem .6rem;
  border-radius: 6px;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.header-text h1 { font-size: 1.2rem; font-weight: 700; color: var(--gold); }
.header-text p  { font-size: .82rem; color: var(--text2); margin-top: .2rem; }

/* ─── Form ───────────────────────────────────────────────────────────────── */
.form-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.form-title { font-size: 1rem; font-weight: 700; color: var(--gold); margin-bottom: 1.2rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-group { display: flex; flex-direction: column; gap: .4rem; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: .8rem; color: var(--text2); font-weight: 600; }
.form-input {
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: inherit;
  font-size: .95rem;
  padding: .65rem .9rem;
  direction: ltr;
  text-align: left;
  transition: border-color .2s;
  width: 100%;
}
.form-input:focus { outline: none; border-color: var(--gold); }
.form-input::placeholder { color: var(--text3); }
.form-hint { font-size: .72rem; color: var(--text3); }
.form-hint a { color: var(--gold); }
.btn-row { display: flex; gap: .8rem; margin-top: 1.2rem; flex-wrap: wrap; }
.btn-primary {
  background: var(--gold);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: .7rem 1.6rem;
  font-size: .95rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s, transform .1s;
  flex: 1;
  min-width: 140px;
}
.btn-primary:hover { background: var(--gold-dark); }
.btn-primary:active { transform: scale(.97); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--text2);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: .7rem 1.2rem;
  font-size: .9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-secondary:hover { border-color: var(--text2); color: var(--text); }

/* ─── Loading / Error / Status ──────────────────────────────────────────── */
#loading { display: none; flex-direction: column; align-items: center; gap: .8rem; padding: 3rem; }
.spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#status-msg { font-size: .85rem; color: var(--gold); }
#error-msg {
  display: none;
  background: rgba(227,76,76,.12);
  border: 1px solid var(--error);
  border-radius: 8px;
  padding: .8rem 1.1rem;
  color: var(--error);
  font-size: .9rem;
  margin-bottom: 1rem;
}

/* ─── Cards ──────────────────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 1.05rem; font-weight: 700; color: var(--gold);
  margin-bottom: 1.2rem; padding-bottom: .7rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: .4rem;
}
.hint { font-size: .75rem; color: var(--text3); font-weight: 400; }
.section-label { font-size: .78rem; font-weight: 700; color: var(--gold); margin-bottom: .35rem; }

/* ─── Copy block ─────────────────────────────────────────────────────────── */
.copy-block {
  display: flex; align-items: flex-start; gap: .6rem;
  background: var(--bg2); border-radius: 8px; padding: .6rem .9rem;
}
.cb-text {
  flex: 1; font-size: .83rem; color: var(--text2);
  overflow-wrap: break-word; word-break: break-word;
  white-space: pre-wrap; line-height: 1.5; min-width: 0;
}
code.cb-text { font-family: 'Courier New', monospace; font-size: .75rem; color: #a8d8b0; }
pre.cb-text {
  font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
  direction: rtl; text-align: right; line-height: 1.8;
}
.copy-btn {
  flex-shrink: 0; background: var(--card2); color: var(--gold);
  border: 1px solid var(--border); border-radius: 6px;
  padding: .25rem .65rem; font-size: .75rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background .2s; white-space: nowrap;
  align-self: flex-start; margin-top: .1rem;
}
.copy-btn:hover { background: var(--gold); color: #000; }
.copy-btn.copied { background: var(--success); color: #000; border-color: var(--success); }

/* ─── Movie Hero ─────────────────────────────────────────────────────────── */
.movie-hero { display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: .5rem; }
.poster-wrap { position: relative; flex-shrink: 0; width: 160px; }
.main-poster { width: 160px; border-radius: 8px; display: block; cursor: pointer; transition: transform .2s; }
.main-poster:hover { transform: scale(1.03); }
.dl-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.75); color: var(--gold);
  text-align: center; font-size: .75rem; padding: .3rem;
  border-radius: 0 0 8px 8px; opacity: 0; transition: opacity .2s;
  text-decoration: none !important;
}
.poster-wrap:hover .dl-overlay { opacity: 1; }
.movie-meta { flex: 1; min-width: 0; }
.rating-badge {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--gold); color: #000; font-weight: 900;
  font-size: 1.1rem; padding: .2rem .7rem; border-radius: 6px; margin-bottom: .7rem;
}
.stars { font-size: .85rem; }
.movie-title { font-size: 1.5rem; font-weight: 900; margin-bottom: .6rem; line-height: 1.2; }
.meta-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: .5rem; margin-top: .8rem;
}
.meta-item {
  display: flex; flex-direction: column; gap: .25rem;
  background: var(--bg2); border-radius: 6px; padding: .5rem .7rem;
}
.meta-label { font-size: .72rem; color: var(--text3); font-weight: 600; }
.meta-item .copy-block { background: transparent; padding: 0; gap: .4rem; }
.meta-item .cb-text { font-size: .85rem; color: var(--text); }

/* ─── Plot ───────────────────────────────────────────────────────────────── */
.plot-section { margin-top: 1.2rem; display: flex; flex-direction: column; gap: .8rem; }
.plot-block { display: flex; flex-direction: column; gap: .35rem; }

/* ─── Action buttons ─────────────────────────────────────────────────────── */
.action-btn {
  display: inline-flex; align-items: center; gap: .35rem;
  background: var(--card2); color: var(--gold);
  border: 1px solid var(--border); border-radius: 8px;
  padding: .5rem 1rem; font-size: .85rem; font-weight: 600; font-family: inherit;
  cursor: pointer; text-decoration: none !important;
  transition: background .2s, border-color .2s;
}
.action-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }

/* ─── Video ──────────────────────────────────────────────────────────────── */
.video-wrap {
  position: relative; padding-top: 56.25%;
  background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 1rem;
}
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
.video-actions { display: flex; gap: .7rem; flex-wrap: wrap; }

/* ─── Links ──────────────────────────────────────────────────────────────── */
.links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.link-item { display: flex; flex-direction: column; gap: .35rem; }
.link-item.full-width { grid-column: 1 / -1; }
.link-label { font-size: .78rem; font-weight: 700; color: var(--text2); }
.link-note  { font-size: .75rem; color: var(--text3); font-style: italic; }

/* ─── Cast ───────────────────────────────────────────────────────────────── */
.cast-grid { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: .8rem; }
.actor-chip {
  display: inline-flex; align-items: center; gap: .5rem;
  background: var(--card2); border: 1px solid var(--border);
  border-radius: 24px; padding: .35rem .9rem .35rem .5rem;
  font-size: .85rem; font-family: inherit; color: var(--text);
  cursor: pointer; transition: background .2s, border-color .2s;
}
.actor-chip:hover { background: var(--gold); color: #000; border-color: var(--gold); }
.actor-chip.copied { background: var(--success); color: #000; border-color: var(--success); }
.actor-avatar {
  width: 28px; height: 28px; background: var(--border);
  border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-weight: 900; font-size: .8rem; flex-shrink: 0;
}
.actor-chip:hover .actor-avatar { background: rgba(0,0,0,.2); }
.mt-1 { margin-top: .8rem; }

/* ─── Gallery ────────────────────────────────────────────────────────────── */
.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: .8rem; margin-bottom: 1rem;
}
.gallery-item {
  border-radius: 8px; overflow: hidden; background: var(--bg2);
  border: 1px solid var(--border); transition: transform .2s;
}
.gallery-item:hover { transform: scale(1.02); }
.gallery-img { width: 100%; display: block; cursor: pointer; aspect-ratio: 2/3; object-fit: cover; }
.gallery-actions {
  display: flex; align-items: center; justify-content: space-between; padding: .4rem .6rem;
}
.gallery-label { font-size: .72rem; color: var(--text3); }
.dl-btn {
  background: var(--card2); color: var(--gold); border: 1px solid var(--border);
  border-radius: 5px; padding: .2rem .5rem; font-size: .8rem;
  cursor: pointer; text-decoration: none !important; transition: background .2s;
}
.dl-btn:hover { background: var(--gold); color: #000; }
.gallery-url-row { padding: 0 .4rem .4rem; }
.gallery-url-row .copy-block { background: transparent; padding: .2rem 0; }
.gallery-url-row .cb-text { font-size: .68rem; color: var(--text3); }
.gallery-more { text-align: center; }

/* ─── Social Cards ───────────────────────────────────────────────────────── */
.social-section { margin-bottom: 2rem; }
.social-label { font-size: .85rem; font-weight: 700; color: var(--text2); margin-bottom: .8rem; }
.social-actions { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: .8rem; }
.card-preview { margin-bottom: .8rem; overflow: auto; }
.card-preview-inner { border-radius: 12px; overflow: hidden; }
.tg-card {
  background: linear-gradient(135deg, #0d1117 0%, #0a1a2f 100%);
  border: 1px solid #1a3a5c; border-right: 4px solid var(--gold);
  display: flex; gap: 1rem; padding: 1.2rem; min-height: 180px;
}
.tg-left { flex-shrink: 0; }
.tg-poster { width: 90px; height: 130px; object-fit: cover; border-radius: 6px; border: 2px solid var(--gold); display: block; }
.tg-right { flex: 1; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.tg-rating { color: var(--gold); font-weight: 900; font-size: .9rem; }
.tg-title  { color: #fff; font-weight: 900; font-size: 1.1rem; }
.tg-sub    { color: var(--gold); font-size: .78rem; }
.tg-meta   { color: #aaa; font-size: .78rem; }
.tg-plot   { color: #999; font-size: .75rem; margin-top: .3rem; direction: rtl; line-height: 1.5; }
.ig-card { position: relative; width: 320px; height: 320px; border-radius: 12px; overflow: hidden; background: #111; }
.ig-bg {
  position: absolute; inset: 0; background-size: cover; background-position: center top;
  filter: blur(2px) brightness(.55); transform: scale(1.05);
}
.ig-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.3) 60%, transparent 100%);
}
.ig-content {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: flex-end; padding: 1.2rem;
}
.ig-rating { font-size: 1.1rem; color: var(--gold); font-weight: 900; margin-bottom: .3rem; }
.ig-title  { font-size: 1.3rem; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: .2rem; }
.ig-year   { font-size: .8rem; color: var(--gold); margin-bottom: .3rem; }
.ig-dir, .ig-actors { font-size: .75rem; color: #ccc; margin-bottom: .15rem; }
.ig-brand {
  display: inline-block; background: var(--gold); color: #000;
  font-weight: 900; font-size: .65rem; padding: .15rem .5rem; border-radius: 4px; margin-top: .4rem;
}

/* ─── Lightbox ───────────────────────────────────────────────────────────── */
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.9);
  z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.lb-inner { position: relative; max-width: 90vw; max-height: 90vh; }
.lb-inner img { max-width: 100%; max-height: 90vh; border-radius: 8px; display: block; }
.lb-close {
  position: absolute; top: -16px; right: -16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gold); color: #000; border: none;
  font-size: 1rem; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ─── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .movie-hero { flex-direction: column; align-items: center; }
  .poster-wrap { width: 140px; }
  .main-poster { width: 140px; }
  .meta-grid { grid-template-columns: 1fr 1fr; }
  .links-grid { grid-template-columns: 1fr; }
  .link-item.full-width { grid-column: 1; }
  .card-title { font-size: .95rem; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  .ig-card { width: 280px; height: 280px; }
}
@media (max-width: 600px) {
  body { background: #0a0a0a; }
  #app { padding: .6rem; }
  .card { padding: 1rem; border-radius: 10px; }
  .form-card { padding: 1rem; }
  .copy-block { flex-direction: column; }
  .copy-btn { align-self: flex-start; }
}
@media (max-width: 480px) {
  .meta-grid { grid-template-columns: 1fr; }
  .movie-title { font-size: 1.2rem; text-align: center; }
  .rating-badge { font-size: .95rem; }
  .logo { font-size: 1.3rem; }
  .header-text h1 { font-size: 1rem; }
  .btn-row { flex-direction: column; }
  .btn-primary, .btn-secondary { width: 100%; }
  .tg-card { flex-direction: column; }
  .tg-poster { width: 70px; height: 100px; }
  .ig-card { width: 100%; height: auto; min-height: 260px; }
}

/* ─── Scrollbar ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
  </style>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="logo">SMDB</div>
      <div class="header-text">
        <h1>استخراج اطلاعات فیلم از IMDb</h1>
        <p>کد فیلم و کد ویدئو را وارد کنید — همه اطلاعات خودکار پر می‌شود</p>
      </div>
    </header>

    <!-- Input Form -->
    <div class="form-card">
      <div class="form-title">🔍 جستجو</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="input-imdb">کد IMDb فیلم</label>
          <input class="form-input" id="input-imdb" type="text" placeholder="tt0133093" maxlength="20" />
          <div class="form-hint">مثال: tt0133093 (ماتریکس)</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="input-video">کد ویدئو IMDb</label>
          <input class="form-input" id="input-video" type="text" placeholder="vi1472252697" maxlength="30" />
          <div class="form-hint">مثال: vi1472252697 (برای تیزر)</div>
        </div>
        <div class="form-group full">
          <label class="form-label" for="input-apikey">کلید API OMDB</label>
          <input class="form-input" id="input-apikey" type="text" placeholder="your_api_key_here" />
          <div class="form-hint">
            کلید رایگان از <a href="https://www.omdbapi.com/apikey.aspx" target="_blank">omdbapi.com</a> دریافت کنید (۱۰۰۰ درخواست/روز رایگان)
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-fetch">🔍 دریافت اطلاعات</button>
        <button class="btn-secondary" id="btn-reset">↺ ریست</button>
      </div>
    </div>

    <!-- Error -->
    <div id="error-msg">
      <span>⚠️ </span><span id="error-text"></span>
    </div>

    <!-- Loading -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="status-msg" style="display:none"></div>
    </div>

    <!-- Results -->
    <div id="results" style="display:none"></div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
