name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/imdb-movie-extractor-mmz6xo', 'main']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable GitHub Pages via API
        run: |
          curl -s -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject runtime and enhancement assets
        run: |
          test -f dist/index.html
          test -f dist/runtime-fixes.js
          test -f dist/smdb-enhancements.js
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/smdb-icon.svg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          head_tag = '<link rel="manifest" href="./manifest.webmanifest">'
          runtime_tag = '<script src="./runtime-fixes.js"></script>'
          enhance_tag = '<script src="./smdb-enhancements.js"></script>'
          if head_tag not in html:
              if '</head>' not in html:
                  raise SystemExit('dist/index.html has no </head> tag')
              html = html.replace('</head>', f'{head_tag}\n</head>', 1)
          body_tags = []
          if runtime_tag not in html:
              body_tags.append(runtime_tag)
          if enhance_tag not in html:
              body_tags.append(enhance_tag)
          if body_tags:
              if '</body>' not in html:
                  raise SystemExit('dist/index.html has no </body> tag')
              html = html.replace('</body>', '\n'.join(body_tags) + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Smoke test generated site
        run: npm test

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
